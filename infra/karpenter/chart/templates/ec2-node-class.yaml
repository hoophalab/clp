apiVersion: "karpenter.k8s.aws/v1"
kind: "EC2NodeClass"
metadata:
  name: {{ .Release.Name | quote }}
spec:
  amiSelectorTerms:
    - alias: "al2023@v20261031"
  instanceProfile: {{ required "instanceProfile is required" .Values.instanceProfile | quote }}
  subnetSelectorTerms:
    {{- range required "subnetIds is required" .Values.subnetIds }}
    - id: {{ . | quote }}
    {{- end }}
  securityGroupSelectorTerms:
    - id: {{ required "securityGroupId is required" .Values.securityGroupId | quote }}
  kubelet:
    systemReserved:
      memory: "512Mi"

apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: {{ .Release.Name | quote }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name | quote }}
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name | quote }}
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name | quote }}
        app.kubernetes.io/instance: {{ .Release.Name | quote }}
    spec:
      containers:
        - name: "auth-server"
          image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy | quote }}
          env:
            - name: "ACCESS_CACHE_MAX_ENTRIES"
              value: {{ .Values.accessCache.maxEntries | quote }}
            - name: "ACCESS_CACHE_TTL_SECONDS"
              value: {{ .Values.accessCache.ttlSeconds | quote }}
            - name: "BASE_DOMAIN"
              value: {{ .Values.baseDomain | quote }}
            - name: "RUST_LOG"
              value: {{ .Values.logFilter | quote }}
            - name: "MYSQL_DATABASE"
              value: {{ .Values.database.name | quote }}
            - name: "MYSQL_HOST"
              value: {{ .Values.database.host | quote }}
            - name: "MYSQL_PASSWORD"
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secret | quote }}
                  key: "password"
            - name: "MYSQL_PORT"
              value: {{ .Values.database.port | quote }}
            - name: "MYSQL_USER"
              value: {{ .Values.database.username | quote }}
          ports:
            - name: "http"
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: "/health"
              port: "http"
          livenessProbe:
            httpGet:
              path: "/health"
              port: "http"
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
      securityContext:
        seccompProfile:
          type: "RuntimeDefault"
      topologySpreadConstraints:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{ .Chart.Name | quote }}
              app.kubernetes.io/instance: {{ .Release.Name | quote }}
          maxSkew: 1
          topologyKey: "topology.kubernetes.io/zone"
          whenUnsatisfiable: "DoNotSchedule"

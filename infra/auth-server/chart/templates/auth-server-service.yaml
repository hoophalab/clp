apiVersion: "v1"
kind: "Service"
metadata:
  name: {{ .Release.Name | quote }}
spec:
  trafficDistribution: "PreferSameZone"
  selector:
    app.kubernetes.io/name: {{ .Chart.Name | quote }}
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
  ports:
    - name: "http"
      port: 8080
      targetPort: "http"

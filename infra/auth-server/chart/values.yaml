image:
  repository: "auth-server"
  tag: "latest"
  pullPolicy: "IfNotPresent"

accessCache:
  maxEntries: 10000
  # Bounds how long a revoked token or removed user keeps working on a replica
  # that cached the record before the change. The cloud console shows this as
  # the revocation countdown (`AUTH_SERVER_CACHE_TTL_SECONDS` in
  # `apps/server/src/api-tokens/token.ts`), so keep the two in sync.
  ttlSeconds: 60

baseDomain: "example.cloud.yscope.com"
database:
  host: "example.cluster.us-east-1.rds.amazonaws.com"
  name: "auth"
  port: 3307
  secret: "auth-server-database"
  username: "auth_server"
logFilter: "auth_server=info"
replicaCount: 1

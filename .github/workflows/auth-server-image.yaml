name: "auth-server image"

on:
  pull_request:
    branches: &target_branches ["main"]
    paths: &monitored_paths
      - ".github/workflows/auth-server-image.yaml"
      - "infra/auth-server/**"
  push:
    branches: *target_branches
    paths: *monitored_paths
  workflow_dispatch:
    inputs:
      aws_region:
        description: "AWS region containing the ECR repository"
        required: true
        type: "string"
      aws_role_arn:
        description: "IAM role ARN to assume using GitHub OIDC"
        required: true
        type: "string"
      ecr_repository:
        description: "ECR repository name"
        required: true
        type: "string"
      image_tag:
        description: "Image tag (defaults to the Git commit SHA)"
        required: false
        type: "string"

permissions:
  contents: "read"
  id-token: "write"

concurrency:
  group: "${{github.workflow}}-${{github.ref}}"
  cancel-in-progress: true

jobs:
  image:
    strategy:
      matrix:
        include:
          - platform: "linux/amd64"
            runner: "${{vars.GH_RUNNER_LINUX_HEAVY_X64}}"
            tag_suffix: "amd64"
          - platform: "linux/arm64"
            runner: "${{vars.GH_RUNNER_LINUX_HEAVY_ARM64}}"
            tag_suffix: "arm64"
    runs-on: "${{fromJSON(matrix.runner)}}"
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"  # v7.0.1

      - name: "Configure AWS credentials"
        if: "github.event_name == 'workflow_dispatch'"
        uses: "aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c"  # v6.2.3
        with:
          aws-region: "${{inputs.aws_region}}"
          role-to-assume: "${{inputs.aws_role_arn}}"

      - name: "Log in to Amazon ECR"
        id: "login-ecr"
        if: "github.event_name == 'workflow_dispatch'"
        uses: "aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64"  # v2.1.6

      - uses: "docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c"  # v4.2.0

      - uses: "docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a"  # v7.3.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
          ECR_REPOSITORY_URI: "${{steps.login-ecr.outputs.registry}}/${{inputs.ecr_repository}}"
        with:
          context: "infra/auth-server"
          platforms: "${{matrix.platform}}"
          push: "${{github.event_name == 'workflow_dispatch'}}"
          tags: "${{github.event_name == 'workflow_dispatch' && env.ECR_REPOSITORY_URI || 'auth-server'}}:${{inputs.image_tag || github.sha}}-${{matrix.tag_suffix}}"

  manifest:
    if: "github.event_name == 'workflow_dispatch'"
    needs: [image]
    runs-on: "${{fromJSON(vars.GH_RUNNER_LINUX_LIGHT_ARM64)}}"
    steps:
      - name: "Configure AWS credentials"
        uses: "aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c"  # v6.2.3
        with:
          aws-region: "${{inputs.aws_region}}"
          role-to-assume: "${{inputs.aws_role_arn}}"

      - name: "Log in to Amazon ECR"
        id: "login-ecr"
        uses: "aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64"  # v2.1.6

      - uses: "docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c"  # v4.2.0

      - name: "Create multi-platform image"
        env:
          ECR_REPOSITORY_URI: "${{steps.login-ecr.outputs.registry}}/${{inputs.ecr_repository}}"
          IMAGE_TAG: "${{inputs.image_tag || github.sha}}"
        run: |
          docker buildx imagetools create \
            --tag "$ECR_REPOSITORY_URI:$IMAGE_TAG" \
            "$ECR_REPOSITORY_URI:$IMAGE_TAG-amd64" \
            "$ECR_REPOSITORY_URI:$IMAGE_TAG-arm64"

name: "apps lint"

on:
  pull_request:
    branches: &target_branches ["main"]
    paths: &monitored_paths
      - ".github/workflows/apps-lint.yaml"
      - "apps/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  push:
    branches: *target_branches
    paths: *monitored_paths
  schedule:
    # Run daily at 00:15 UTC (the 15 is to avoid periods of high load)
    - cron: "15 0 * * *"
  workflow_dispatch:

permissions:
  contents: "read"

concurrency:
  group: "${{github.workflow}}-${{github.ref}}"
  # Cancel in-progress jobs for efficiency
  cancel-in-progress: true

jobs:
  lint:
    strategy:
      fail-fast: false
      matrix:
        app: ["server", "web"]
    runs-on: "${{fromJSON(vars.GH_RUNNER_LINUX_LIGHT_X64)}}"
    env:
      # Use a per-job pnpm store, since the default store is shared by all jobs on a runner host.
      pnpm_config_store_dir: "${{github.workspace}}/../.pnpm-store"
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"  # v7.0.1

      - uses: "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020"  # v7.0.0
        with:
          node-version: "24"

      - uses: "pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413"  # v6.1.0
        with:
          cache: true

      - run: "pnpm install --frozen-lockfile"

      - run: "pnpm --filter @cloud.yscope.com/${{matrix.app}}^... run build"

      - run: "pnpm --filter @cloud.yscope.com/${{matrix.app}} run lint"

name: "synth"

on:
  pull_request:
    branches: &target_branches ["main"]
    paths: &monitored_paths
      - ".github/workflows/cloud-cdk-synth.yaml"
      - "infra/cdk/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  push:
    branches: *target_branches
    paths: *monitored_paths
  schedule:
    # Run daily at 00:15 UTC (the 15 is to avoid periods of high load)
    - cron: "15 0 * * *"
  workflow_dispatch:

permissions:
  contents: "read"

concurrency:
  group: "${{github.workflow}}-${{github.ref}}"
  # Cancel in-progress jobs for efficiency
  cancel-in-progress: true

jobs:
  synth:
    runs-on: "${{fromJSON(vars.GH_RUNNER_LINUX_LIGHT_X64)}}"
    env:
      CDK_DEFAULT_ACCOUNT: "123456789012"
      CDK_DEFAULT_REGION: "us-east-1"
    steps:
      - uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd"  # v6.0.2

      - uses: "actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e"  # v6.4.0
        with:
          node-version: "24"

      - uses: "pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093"  # v6.0.8
        with:
          cache: true

      - run: "pnpm install --frozen-lockfile"

      - run: "pnpm run build:cdk"

      - name: "Seed dummy CDK context"
        working-directory: "infra/cdk"
        run: |
          cat > cdk.context.json <<'EOF'
          {
            "availability-zones:account=123456789012:region=us-east-1": [
              "us-east-1a",
              "us-east-1b",
              "us-east-1c"
            ]
          }
          EOF

      - name: "Synthesize cluster stacks"
        working-directory: "infra/cdk"
        run: >-
          pnpm run cdk:cluster synth
          -c com.yscope.cloud/clusterName=test
          -c com.yscope.cloud/clusterAdminRoleArn=arn:aws:iam::123456789012:role/test-cluster-admin
          -c com.yscope.cloud/domainName=cloud.yscope.com
          -c com.yscope.cloud/cloudflareZoneNames=yscope.com
          -c com.yscope.cloud/cloudflareApiTokenParameterName=/cloud/test/cloudflare-api-token
          -c com.yscope.cloud/auth0Domain=test.us.auth0.com
          -c com.yscope.cloud/auth0ClientId=test-client-id
          -c com.yscope.cloud/auth0ClientSecretParameterName=/cloud/test/auth0-client-secret
          -c com.yscope.cloud/authServerImageTag=0000000000000000000000000000000000000000
          -c com.yscope.cloud/githubRepository=y-scope/cloud.yscope.com

      - name: "Synthesize account stack"
        working-directory: "infra/cdk"
        run: "pnpm run cdk:account synth"

      - name: "Synthesize deployment stack"
        working-directory: "infra/cdk"
        run: >-
          pnpm run cdk:deployment synth
          -c com.yscope.cloud/clusterName=test
          -c com.yscope.cloud/clusterSecret=test-cluster-secret
          -c com.yscope.cloud/domainName=cloud.yscope.com
          -c com.yscope.cloud/deploymentId=0123456789abcdef
          -c com.yscope.cloud/clpChart=clp
          -c com.yscope.cloud/clpChartVersion=0.3.0
          -c com.yscope.cloud/clpImageTag=0.12.0

{{- if has "results_cache" .Values.clpConfig.bundled }}
{{- $storage := .Values.storage.resultsCache }}
{{- if not (has $storage.type (list "persistentVolumeClaim" "ephemeral")) }}
{{- fail (printf "storage.resultsCache.type must be \"persistentVolumeClaim\" or \"ephemeral\", not %q" $storage.type) }}
{{- end }}
{{- $volumeName := include "clp.volumeName" (dict "component_category" "results-cache" "name" "data") }}
apiVersion: "apps/v1"
kind: "StatefulSet"
metadata:
  name: {{ include "clp.fullname" . }}-results-cache
  labels:
    {{- include "clp.labels" . | nindent 4 }}
    app.kubernetes.io/component: "results-cache"
spec:
  serviceName: {{ include "clp.fullname" . }}-results-cache
  replicas: 1
  selector:
    matchLabels:
      {{- include "clp.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: "results-cache"
  template:
    metadata:
      labels:
        {{- include "clp.labels" . | nindent 8 }}
        app.kubernetes.io/component: "results-cache"
    spec:
      {{- include "clp.createSchedulingConfigs" (dict
          "root" .
          "component" "resultsCache"
        ) | nindent 6 }}
      containers:
        - name: "results-cache"
          image: {{ include "clp.imageRef" (dict "root" . "component" "resultsCache") | quote }}
          imagePullPolicy: {{ .Values.image.resultsCache.pullPolicy | quote }}
          {{- include "clp.createResourceLimits" (dict
              "root" .
              "component" "resultsCache"
            ) | nindent 10 }}
          ports:
            - name: "results-cache"
              containerPort: 27017
          volumeMounts:
            - name: {{ $volumeName | quote }}
              mountPath: "/data/db"
            - name: "config"
              mountPath: "/etc/mongo/mongod.conf"
              subPath: "mongod.conf"
              readOnly: true
          args: [
            "--config", "/etc/mongo/mongod.conf",
            "--bind_ip", "0.0.0.0"
          ]
          readinessProbe:
            {{- include "clp.readinessProbeTimings" . | nindent 12 }}
            exec: &results-cache-health-check
              command:
                - "mongosh"
                - "127.0.0.1:27017/test"
                - "--quiet"
                - "--eval"
                - "db.runCommand('ping').ok"
          livenessProbe:
            {{- include "clp.livenessProbeTimings" . | nindent 12 }}
            exec: *results-cache-health-check
        - name: "results-cache-init"
          image: {{ include "clp.imageRef" (dict "root" . "component" "clpPackage") | quote }}
          imagePullPolicy: "{{ .Values.image.clpPackage.pullPolicy }}"
          {{- include "clp.createResourceLimits" (dict
              "root" .
              "component" "resultsCacheIndicesCreator"
            ) | nindent 10 }}
          env:
            - name: "PYTHONPATH"
              value: "/opt/clp/lib/python3/site-packages"
          command:
            - "/bin/sh"
            - "-c"
            - |
              set -e
              until python3 -c "import socket; s=socket.socket(); s.settimeout(2); s.connect(('{{ include "clp.resultsCacheHost" . }}', {{ include "clp.resultsCachePort" . | int }})); s.close()" 2>/dev/null; do
                sleep 1
              done
              python3 -u -m clp_py_utils.initialize-results-cache \
                --uri "mongodb://{{ include "clp.resultsCacheHost" . }}:{{ include "clp.resultsCachePort" . | int }}/{{ .Values.clpConfig.results_cache.db_name }}" \
                --stream-collection {{ .Values.clpConfig.results_cache.stream_collection_name | quote }}
              touch /tmp/init-complete
              sleep infinity
          readinessProbe:
            {{- include "clp.readinessProbeTimings" . | nindent 12 }}
            exec:
              command:
                - "test"
                - "-f"
                - "/tmp/init-complete"
      volumes:
        - name: "config"
          configMap:
            name: {{ include "clp.fullname" . }}-config
        {{- if eq $storage.type "ephemeral" }}
        - name: {{ $volumeName | quote }}
          ephemeral:
            volumeClaimTemplate:
              metadata:
                labels:
                  {{- include "clp.labels" . | nindent 18 }}
                  app.kubernetes.io/component: "results-cache"
              spec:
                {{- include "clp.resultsCacheVolumeClaimSpec" $storage | nindent 16 }}
        {{- end }}
  {{- if eq $storage.type "persistentVolumeClaim" }}
  volumeClaimTemplates:
    - metadata:
        name: {{ $volumeName | quote }}
      spec:
        {{- include "clp.resultsCacheVolumeClaimSpec" $storage | nindent 8 }}
  {{- end }}
{{- end }}
